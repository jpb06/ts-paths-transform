name: ⚡ Publish

on:
  workflow_run:
    workflows: ['⚡ Integration checks']
    branches: [main]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    name: 🛩️ Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📦 Setup bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2

      - name: ⎔ Setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          # cache: 'bun'
          cache-dependency-path: ./package.json

      - name: 📥 Install deps
        run: bun install --frozen-lockfile

      - name: ✏️ Bump package version
        id: bumping-version
        uses: jpb06/bump-package@fa5d480f0bf85f32606cbe3132e7e595db2fe524 # v2.8.14
        with:
          major-keywords: BREAKING CHANGE
          minor-keywords: feat,minor
          patch-keywords: fix,chore
          should-default-to-patch: true
          commit-user: jpb06
          commit-user-email: jpb.06@outlook.com

      - name: ⚙️ Building package
        run: bun run build

      - name: 🚀 Publish package
        if: steps.bumping-version.outputs.bump-performed == 'true'
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ''  # Clear placeholder set by setup-node to enable OIDC
        run: npm publish ./dist --access public --provenance
